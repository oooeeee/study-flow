repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.5
    hooks:
      - id: ruff
        name: ruff lint (backend)
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        name: ruff format (backend)
        files: ^backend/

  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        entry: frontend/node_modules/.bin/eslint
        language: system
        files: ^frontend/src/.*\.[jt]sx?$
        args: [--fix, --config, frontend/eslint.config.js]

      - id: prettier
        name: prettier (frontend)
        entry: frontend/node_modules/.bin/prettier
        language: system
        files: ^frontend/src/.*\.(ts|tsx|js|jsx|css|json)$
        args: [--write]
